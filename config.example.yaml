name: file-exchange
version: 1

# Backend configuration (used for all projects)
backend:
  type: local
  config:
    base_dir: /path/to/remote/storage

# Project configurations
# Each project has its own watch directory and action jobs
projects:
  - id: web-app
    name: Web Application
    watch_dir: projects/web-app/patches
    file_match: "*.patch"
    jobs:
      - id: apply
        type: exec
        cmd: git am --3way {file_path}
      - id: cleanup
        type: file_delete
        path: "{file_remote_path}"
        if: jobs.apply.success

  - id: api-service
    name: API Service
    watch_dir: projects/api-service/patches
    file_match: "*.patch"
    jobs:
      - id: apply
        type: exec
        cmd: git am --3way {file_path}
      - id: cleanup
        type: file_delete
        path: "{file_remote_path}"
        if: jobs.apply.success

interval_seconds: 60