name: file-exchange
version: 1

backend:
  type: local
  config:
    base_dir: /path/to/remote/storage

# Watch configurations
# Each watch monitors a directory for files matching paths, then executes jobs
watch:
  - watch_dir: projects/web-app/patches
    paths: ["*.patch"]
    jobs:
      - id: apply
        type: exec
        cmd: git am --3way {file_path}
      - id: cleanup
        type: file_delete
        path: "{file_remote_path}"
        if: jobs.apply.success

  - watch_dir: projects/web-app/deploy
    paths: ["deploy-*.yaml"]
    jobs:
      - id: deploy
        type: exec
        cmd: ./deploy.sh {file_name}

  - watch_dir: projects/api-service/patches
    paths: ["*.patch"]
    jobs:
      - id: apply
        type: exec
        cmd: git am --3way {file_path}
      - id: cleanup
        type: file_delete
        path: "{file_remote_path}"
        if: jobs.apply.success

interval_seconds: 60