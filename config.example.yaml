name: file-exchange
version: 1

backend:
  type: local
  config:
    base_dir: /tmp/file-exchange
    command_dir: commands

watchers:
  - name: Apply Patch
    on:
      file_match: "*.patch"
      watch_dir: patches
    jobs:
      - id: apply
        type: exec
        cmd: "echo Applying patch {file_name}"
        cwd: /tmp
      - id: cleanup
        type: file_delete
        path: "{file_remote_path}"

interval_seconds: 60