name: file-exchange
version: 1

backend:
  type: local
  config:
    base_dir: /path/to/remote/storage

watch:
  - id: web-app-patches
    watch_dir: projects/web-app/patches   # 远端中转站目录
    local_dir: /path/to/local/repo       # 本机工作目录
    paths: ["*.patch"]
    jobs:
      - id: apply
        type: exec
        cmd: git am --3way {file_path}
      - id: cleanup
        type: file_delete
        path: "{file_remote_path}"
        if: jobs.apply.success

  - id: web-app-deploy
    watch_dir: projects/web-app/deploy
    local_dir: /path/to/local/repo
    paths: ["deploy-*.yaml"]
    jobs:
      - id: deploy
        type: exec
        cmd: ./deploy.sh {file_name}

  - id: api-service-patches
    watch_dir: projects/api-service/patches
    local_dir: /path/to/api/repo
    paths: ["*.patch"]
    jobs:
      - id: apply
        type: exec
        cmd: git am --3way {file_path}
      - id: cleanup
        type: file_delete
        path: "{file_remote_path}"
        if: jobs.apply.success

interval_seconds: 60