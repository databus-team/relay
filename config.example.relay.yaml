name: relay
version: 2

# One config shared by all three ends: transit (relay server), remote executor
# (relay watch), and local CLI (relay push/exec). Only the relevant section is
# used on each side; run `relay sync` to push a copy to the remote watcher.
#
#   relay server -c config.yaml   # transit reads the `server:` block
#   relay watch  -c config.yaml   # remote executor reads backend+watch (+executor)
#   relay push   -c config.yaml   # local CLI reads backend+watch
#   relay sync   -c config.yaml   # ship this same file to the remote executor

# --- transit server block (only relay server reads this) ---
server:
  addr: ":8443"
  watch_root: /data/relay          # each watch.watch_dir below is relative to this
  auth:
    tokens: ["${RELAY_TOKEN}"]
  tls:
    enabled: false                # enable with cert_file/key_file for wss://
    cert_file: ""
    key_file: ""

# Example: native relay backend
# WebSocket-based relay server with streaming, compression, and event push
backend:
  type: relay
  config:
    url: ${RELAY_SERVER_URL}          # ws://host:port/relay or wss://...
    token: ${RELAY_TOKEN}
    # headers:                          # 可选:WebSocket 握手携带的 HTTP 头(中转前置鉴权)
    #   Cookie: "code-server-session=..."
    #   X-Api-Key: ${RELAY_API_KEY}
    watch_id: web-app-patches          # subscribe to this watch on server
    watch_dir: .                       # remote watch directory (relative to server's watch dir)
    command_dir: /tmp/relay-commands   # shared command directory for hot-reload
    # executor: true                    # 声明本配置对应的执行方角色:
    #                                    # 仅在 relay watch(执行方进程)侧生效——注册为 watch_id 的执行方,
    #                                    # 接收经中转转发的 relay exec / relay push 并本地执行。
    #                                    # 本地 CLI(relay exec / relay push / relay sync)不读取此字段:
    #                                    # 即便同一份配置带 executor: true,本地 exec 仍透明转发到远端执行方,
    #                                    # 不会自注册、不会把命令转发回本机——故可安全地与远端共用一份配置。
    #                                    # executor_dir: /path/to/remote/project   # push 时文件落在执行方的该目录下(可省略,默认进程当前目录)

watch:
  - id: web-app-patches
    watch_dir: .                       # relative to server's watch_root (server) and remote dir (client)
    local_dir: /path/to/local/repo
    paths: ["*.patch"]
    ttl: 30m                           # transit auto-deletes files older than 30m (server-side only)
    # manually on the local machine with:
    #   relay job run apply ./my.patch
    jobs:
      - id: apply
        type: exec
        cmd: git am --3way {file_path}
      - id: cleanup_remote
        type: file_delete
        target: remote          # default; deletes {file_remote_path} on the backend's watch_dir
        path: "{file_remote_path}"
        if: jobs.apply.success
      - id: cleanup_local
        type: file_delete
        target: local           # deletes the local copy with os.Remove on this machine
        path: "{file_path}"
        if: jobs.apply.success

  - id: web-app-deploy
    watch_dir: .
    local_dir: /path/to/local/repo
    paths: ["deploy-*.yaml"]
    auto_cleanup: true
    jobs:
      - id: deploy
        type: exec
        cmd: ./deploy.sh {file_name}

# Note: interval_seconds is ignored when using relay backend
# (event-driven mode replaces polling automatically)
interval_seconds: 60
