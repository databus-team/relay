name: relay
version: 2

# Example: jumpserver backend
# JumpServer REST API (file operations only, no exec support)
backend:
  type: jumpserver
  config:
    base_url: ${JUMPSERVER_URL}
    username: ${JUMPSERVER_USERNAME}
    password: ${JUMPSERVER_PASSWORD}

workspaces:
  - id: web-app-patches
    watch_dir: /patches/web-app
    local_dir: /workspace/web-app
    paths: ["*.patch"]
    jobs:
      - id: backup
        type: exec
        cmd: rm -f {file_remote_path}

interval_seconds: 60